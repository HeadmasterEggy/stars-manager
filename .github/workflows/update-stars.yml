name: Update stars

on:
  schedule:
    - cron: "17 2 * * 1"   # 每周一 02:17 UTC（北京时间 10:17）
  workflow_dispatch:
    inputs:
      reclassify:
        description: "用 AI 全部重新分类（忽略缓存）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_stars.py "${{ github.repository_owner }}"

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q -r requirements.txt
            python3 scripts/classify_stars.py --ai ${{ inputs.reclassify && '--all' || '' }}
          else
            echo "未配置 ANTHROPIC_API_KEY，使用规则分类"
            python3 scripts/classify_stars.py
          fi

      - name: Generate STARS.md and web data
        run: python3 scripts/generate_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STARS.md docs/data.json
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: update stars ($(date -u +%Y-%m-%d))"
            git push
          fi
